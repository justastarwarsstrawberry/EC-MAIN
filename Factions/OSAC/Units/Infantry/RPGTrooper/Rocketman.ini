[core]
name: RKTCSoldier
copyFrom: ROOT:Effects.template, ROOT:OSAC_inf.template,ROOT:VCD.template

displayText: Cybrus 
displayDescription: [CLASS]\n Anti-tank, Anti-Air \n \n[DESCRIPTION]\nA direct branch from Cyclops infantry, only refitted with dfferent weapons \n - Missile miss chance if unit fast enough \n- Can attack land and air boogies
class: CustomUnitMetadata
price: 200, AdvanceParts=1.2
streamingCost: AdvanceParts=1
maxHp: 225
mass: 420
tags: Infantry_RB
explodeOnDeath: true
numBitsOnDeath: 2
techLevel: 1
buildSpeed: 14.0s
#availableInDemo: true
energyRegen: 0.002
energyMax: 1
radius: 5
displayRadius: 5
isUnrepairableUnit: true
isBio: false
softCollisionOnAll: 0

armour: 5


[hiddenAction_deadBuilding]
@copyFrom_skipThisSection: true

[action_slower]
setUnitStats: moveSpeed=0.63, maxTurnSpeed=1.75

[effect_smokeGround]
xOffsetRelativeRandom: 18
yOffsetRelativeRandom: -40

[graphics]
total_frames: 1

image:        RPGTroopOSAC.png
image_wreak:  ROOT:Common/dedrobot.png

turretImageScale:0.9
image_shadow: ROOT:common/shadow.png
shadowOffsetX:1.5
shadowOffsetY:1.5
imageScale: 0.55


lock_body_rotation_with_main_turret: true
animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 7

animation_attack_start: 0
animation_attack_end: 0
animation_attack_speed: 90
#animation_attack_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 1

animation_moving_scale_start:1
animation_moving_scale_end:1.05
animation_moving_pingPong: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 4

isFixedFiring: true

maxAttackRange: 220
shootDelay: 120

[turret_1]
#
x: 0
y: -4

projectile: 1
canAttackFlyingUnits: false
turnSpeedAcceleration: 1.0
energyUsage: 1
warmup: 1.3s
shoot_sound:missile_fire
shoot_sound_vol:0.3
shoot_flame:CUSTOM: smokeGround
shoot_light:#FFEECCCC

canShoot: true


recoilOffset: -2
recoilOutTime: 4
recoilReturnTime: 2
idleSweepAngle: 5
idleSweepSpeed: 0.3
idleSweepAddRandomAngle: 30
idleSweepAddRandomDelay: 500
idleSweepCondition: if not self.isAttacking()

[turret_2]
#
x: 0
y: -4

projectile: 2
canAttackFlyingUnits: true
canAttackLandUnits:   false
turnSpeedAcceleration: 1.0
energyUsage: 1
warmup: 1.3s
shoot_sound:missile_fire
shoot_sound_vol:0.3
shoot_flame:CUSTOM: smokeGround
shoot_light:#FFEECCCC

canShoot: true


recoilOffset: -2
recoilOutTime: 4
recoilReturnTime: 2
idleSweepAngle: 5
idleSweepSpeed: 0.3
idleSweepAddRandomAngle: 30
idleSweepAddRandomDelay: 500
idleSweepCondition: if not self.isAttacking()
[projectile_1]
directDamage: 60
life: 240
speed: 0.3
targetSpeed: 6
turnSpeed: 0.55
largeHitEffect: true
