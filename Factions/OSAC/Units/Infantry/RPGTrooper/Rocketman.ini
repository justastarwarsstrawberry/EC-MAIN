#ballistic_delaymove_height:0
#ballistic_height: 4
frame: 4
#areaDamage: 40
#areaRadius: 35
drawSize: 1
image:ROOT:Common/microM_proj.png
trailEffect: CUSTOM:missileFlare1B, CUSTOM:projectileSmoke
trailEffectRate: 3

mutator9_ifUnitWithTags: infantry
