[core]


name: teslainfantry
copyFrom: ROOT:Effects.template, ROOT:OSAC_inf.template, ROOT:VCD.template

displayText: Zeus
displayDescription:  [CLASS]\n Anti-Tank, Anti-Infantry, Anti-Spam \n \n[DESCRIPTION]\nThe Zeus is a lightning carried weapon version of cyclops. \n - Chain lightning reaction \n - good against swarms and light units \n - Cannot attack air units as it would be too dangerous
class: CustomUnitMetadata
price: 600, AdvanceParts=2
streamingCost: AdvanceParts=2.3
armour: 5
maxHp: 300
mass: 3000
tags: Infantry_RB
techLevel: 2
buildSpeed: 21.6s
#availableInDemo: true

radius: 4
displayRadius: 5
isUnrepairableUnit: true
isBio: false
softCollisionOnAll: 0

explodeOnDeath: true
numBitsOnDeath: 2


[hiddenAction_deadBuilding]
@copyFrom_skipThisSection: true
[graphics]
total_frames: 1
turretImageScale:0.9
image_shadow: ROOT:common/shadow.png
shadowOffsetX:1.5
shadowOffsetY:1.5
imageScale: 0.55
image:   teslatrooper.png    
image_wreak:  ROOT:Common/dedrobot.png

lock_body_rotation_with_main_turret: true
animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 7

animation_attack_start: 0
animation_attack_end: 0
animation_attack_speed: 90
#animation_attack_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 1

animation_moving_scale_start:1
animation_moving_scale_end:1.05
animation_moving_pingPong: true
[action_slower]
autoTrigger: if self.customTimer(laterThanSeconds=150) and not self.hasFlag(id=5)


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretTurnSpeed: 4

isFixedFiring: true

maxAttackRange: 170
#nice
shootDelay: 69

[turret_1]
#
x: 2
y: 7

projectile: 1
canAttackLandUnits:true
turnSpeedAcceleration: 1.0

shoot_sound:lighting_burst
shoot_sound_vol:0.3
limitingAngle: 45
canShoot: true

warmup:20

chargeEffectImage: SHARED:lighting_charge.png
idleSweepAngle: 5
idleSweepSpeed: 0.3
idleSweepAddRandomAngle: 30
idleSweepAddRandomDelay: 500
idleSweepCondition: if not self.isAttacking()


[projectile_1]
directDamage: 25
life: 10 

spawnUnit: chainLight_O1
shieldDamageMultiplier: 1
shieldDefectionMultiplier: 0.1
lightingEffect: true

buildingDamageMultiplier: 0.5

instant: true

mutator9_ifUnitWithTags: infantry
